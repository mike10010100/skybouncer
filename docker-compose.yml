# ==============================================================================
# Docker Compose Configuration for Skybouncer
# Sovereign Auto-Moderation & Bouncer Service for AT Protocol & Bluesky
# ==============================================================================

services:
  skybouncer:
    build:
      context: ..
      dockerfile: skybouncer/Dockerfile
    image: skybouncer:${IMAGE_TAG:-latest}
    container_name: skybouncer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${PORT_BIND:-3031}:3000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - WEB_ENABLED=true
      - HOSTNAME=${HOSTNAME:-skybouncer.example.com}
      - PUBLIC_URL=${PUBLIC_URL:-https://skybouncer.example.com}
      - SERVICE_DID=${SERVICE_DID:-did:web:skybouncer.example.com}
      - SKYBOUNCER_DATABASE_PATH=/data/skybouncer.db
      - ADMIN_DID=${ADMIN_DID:-}
      - RUST_LOG=${RUST_LOG:-info,skybouncer=info,skybase=info}
    stop_grace_period: 30s
    volumes:
      # Persistent storage for SQLite deduplication and evaluation TTL cache
      - skybouncer_data:/data:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT:-2048M}
        reservations:
          memory: 256M
    networks:
      - skybouncer_net

  # ----------------------------------------------------------------------------
  # Cloudflare Tunnel for Secure Public HTTPS Access & OAuth Callbacks
  # Forwards traffic from your public domain (e.g. skybouncer.example.com)
  # directly into the isolated container network without exposing router ports.
  # ----------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: skybouncer-cloudflared
    profiles:
      - tunnel
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ~/.cloudflared:/etc/cloudflared:ro
    depends_on:
      skybouncer:
        condition: service_healthy
    networks:
      - skybouncer_net

  # ----------------------------------------------------------------------------
  # Optional Local AI Engine: Ollama with Multimodal Vision (Gemma 4:12B, LLaVA)
  # Activated via: docker compose --profile local-ai up -d
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: skybouncer-ollama
    profiles:
      - local-ai
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT_BIND:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - skybouncer_net
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEM_LIMIT:-16384M}
        reservations:
          memory: 4096M

volumes:
  skybouncer_data:
    name: skybouncer_data
  ollama_models:
    name: skybouncer_ollama_models

networks:
  skybouncer_net:
    name: skybouncer_net
    driver: bridge
