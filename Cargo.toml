[package]
name = "skybouncer"
version = "0.2.20"
edition = "2021"
rust-version = "1.89"
authors = ["Michael Paulauski <mike10010100@gmail.com>"]
description = "Sovereign, Rule-Driven Auto-Moderation & Bouncer Service for AT Protocol and Bluesky"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mike10010100/skybouncer"
homepage = "https://github.com/mike10010100/skybouncer"
documentation = "https://docs.rs/skybouncer"
keywords = ["atproto", "bluesky", "moderation", "bouncer", "jev"]
categories = ["web-programming", "asynchronous"]
readme = "README.md"

[lib]
name = "skybouncer"
path = "src/lib.rs"

[[bin]]
name = "skybouncer"
path = "src/main.rs"
required-features = ["web", "stream", "bot", "telemetry"]

[features]
default = ["web", "stream", "bot", "telemetry"]
# Axum HTTP API, dashboard, and OAuth callback endpoints.
web = ["dep:axum", "dep:tower-http", "skyauth/axum"]
# Jetstream firehose WebSocket ingestion.
stream = ["dep:tokio-tungstenite"]
# ATProto Chat/DM bot command handling.
bot = []
# `tracing-subscriber` initialization helper for binaries.
telemetry = ["dep:tracing-subscriber"]

[dependencies]
# Sibling dependencies, consumed from crates.io (published by each repo's CI).
skybase = "0.1.6"
skyauth = "0.3.9"

# HTTP Web Framework & Networking
axum = { version = "0.8", optional = true, default-features = false, features = ["json", "query", "tokio", "macros", "http1"] }
tower-http = { version = "0.6", optional = true, default-features = false, features = ["cors", "trace"] }

# Concurrency & Async Runtime
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }

tokio-util = "0.7"
async-trait = "0.1"
parking_lot = "0.12"

# Pattern Matching & Heuristics
regex = "1.10"

# Embedded Database & Persistence
rusqlite = { version = "0.39", features = ["bundled"] }

# Serialization & JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"

# Networking & HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["std", "ring"] }
webpki-roots = "1.0.10"
url = { version = "2.5", features = ["serde"] }

# Error Handling & Observability
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["env-filter", "fmt", "ansi"] }

# WebSocket Stream Ingestion for Live Daemon
tokio-tungstenite = { version = "0.30", optional = true, features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", features = ["sink"] }


[dev-dependencies]
tokio = { version = "1.40", features = ["full", "test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
wiremock = "0.6"
tempfile = "3"
proptest = "1.5"
rustls-pki-types = "1.12"

[profile.test]
opt-level = 1


