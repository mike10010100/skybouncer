# ==============================================================================
# Nginx Reverse Proxy Configuration for Skybouncer
# Handles HTTPS termination and OAuth 2.0 PKCE / DPoP redirect headers.
# Note: Use 127.0.0.1:3031 for Docker Compose deployments or 127.0.0.1:3000 for systemd.
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name moderation.example.com;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name moderation.example.com;

    # SSL certificates (e.g. Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/moderation.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moderation.example.com/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Allow 8 MiB /api/simulate image payloads plus JSON overhead
    client_max_body_size 10m;

    # Security headers (HSTS, CSP, X-Frame-Options, X-Content-Type-Options, Referrer-Policy)
    # are emitted directly by Skybouncer's Axum security_headers_middleware to avoid duplicates.

    # Restrict Prometheus metrics endpoints to loopback scrapers
    location ~ ^/(api/)?metrics$ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
    }

    # Reverse proxy to Skybouncer backend (change :3000 to :3031 for Docker Compose)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Conditional WebSocket upgrade (preserves HTTP/1.1 keepalive for normal requests)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forwarded identity headers; strip client-supplied CF-Connecting-IP to prevent spoofing
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";

        # Timeouts aligned with Axum's 130s request timeout (accommodates 120s Tier-2 LLM calls)
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        proxy_connect_timeout 10s;
    }

    # Custom healthcheck endpoint pass-through (change :3000 to :3031 for Docker Compose)
    location /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
        access_log off;
    }
}
