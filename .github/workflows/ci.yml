name: CI & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version-bump-check:
    name: Enforce Semantic Version Bump & CHANGELOG on PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Semantic Version Bump & CHANGELOG Entry
        run: |
          chmod +x ./scripts/check_version_bump.sh
          ./scripts/check_version_bump.sh

  lint-and-audit:
    name: Lint, Audit & Lean Core
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout skybouncer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "lint"
          cache-on-failure: true

      - name: Install CI Cargo Utilities
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny,cargo-audit

      - name: 1. Enforce Code Formatting
        run: cargo fmt --all -- --check

      - name: 2. Enforce Strict Clippy Lints
        run: cargo clippy --all-targets -- -D warnings

      - name: 2b. Enforce Lean Core Build & Tests (no default features)
        run: |
          cargo clippy --lib --no-default-features -- -D warnings
          cargo test --lib --no-default-features

      - name: 3. Dependency Policy Governance (cargo-deny)
        run: cargo deny check

      - name: 4. Security Vulnerability Scan (cargo-audit)
        run: cargo audit

  msrv:
    name: MSRV Check (Rust 1.89)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout skybouncer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.89 Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.89"

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "msrv-1.89"
          cache-on-failure: true

      - name: Verify MSRV Compilation
        run: cargo check --all-targets --locked

  shellcheck:
    name: ShellCheck Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout skybouncer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: shellcheck

      - name: Run ShellCheck on Shell Scripts
        run: shellcheck scripts/*.sh deploy/systemd/install.sh

  docker-smoke:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout skybouncer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker Image (Smoke)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  coverage-and-tests:
    name: Test Suite & Coverage (>= 92%)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_LLVM_COV_TARGET_DIR: target
    steps:
      - name: Checkout skybouncer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install CI Cargo Utilities
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "coverage"
          cache-all-crates: true
          cache-on-failure: true

      - name: 5. Run Test Suite & Enforce >= 92% Coverage (nextest + llvm-cov)
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --all-targets --lcov --output-path lcov.info
          cargo llvm-cov report --fail-under-lines 92

      - name: 6. Run Documentation Tests
        run: cargo test --doc

  mutants-smoke:
    name: Mutation Testing Smoke Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout skybouncer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "mutants-lean"
          cache-all-crates: true
          cache-on-failure: true

      - name: Install cargo-nextest & cargo-mutants
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-nextest,cargo-mutants

      - name: 7. Mutation Testing Smoke Test (cargo-mutants)
        # Reuses cached target/ in-place on lean-core unit tests (--no-default-features)
        # while covering 100% of mutants in src/time.rs and src/util.rs.
        run: cargo mutants --in-place --cargo-arg --no-default-features --cargo-arg --lib --file src/time.rs --file src/util.rs

  quality-gate:
    name: Rust Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [version-bump-check, lint-and-audit, msrv, shellcheck, docker-smoke, coverage-and-tests, mutants-smoke]
    steps:
      - name: Verify All Parallel Quality Gate Jobs Succeeded
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_RESULT: ${{ needs.version-bump-check.result }}
          LINT_RESULT: ${{ needs.lint-and-audit.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          SHELLCHECK_RESULT: ${{ needs.shellcheck.result }}
          DOCKER_RESULT: ${{ needs.docker-smoke.result }}
          COV_RESULT: ${{ needs.coverage-and-tests.result }}
          MUTANTS_RESULT: ${{ needs.mutants-smoke.result }}
        run: |
          echo "version-bump-check: ${VERSION_RESULT}"
          echo "lint-and-audit    : ${LINT_RESULT}"
          echo "msrv              : ${MSRV_RESULT}"
          echo "shellcheck        : ${SHELLCHECK_RESULT}"
          echo "docker-smoke      : ${DOCKER_RESULT}"
          echo "coverage-and-tests: ${COV_RESULT}"
          echo "mutants-smoke     : ${MUTANTS_RESULT}"
          if [[ "${EVENT_NAME}" == "pull_request" && "${VERSION_RESULT}" != "success" ]]; then
            echo "::error::version-bump-check failed (${VERSION_RESULT})"
            exit 1
          fi
          if [[ "${EVENT_NAME}" != "pull_request" && "${VERSION_RESULT}" != "success" && "${VERSION_RESULT}" != "skipped" ]]; then
            echo "::error::version-bump-check failed (${VERSION_RESULT})"
            exit 1
          fi
          if [[ "${LINT_RESULT}" != "success" ]]; then
            echo "::error::lint-and-audit failed (${LINT_RESULT})"
            exit 1
          fi
          if [[ "${MSRV_RESULT}" != "success" ]]; then
            echo "::error::msrv failed (${MSRV_RESULT})"
            exit 1
          fi
          if [[ "${SHELLCHECK_RESULT}" != "success" ]]; then
            echo "::error::shellcheck failed (${SHELLCHECK_RESULT})"
            exit 1
          fi
          if [[ "${DOCKER_RESULT}" != "success" ]]; then
            echo "::error::docker-smoke failed (${DOCKER_RESULT})"
            exit 1
          fi
          if [[ "${COV_RESULT}" != "success" ]]; then
            echo "::error::coverage-and-tests failed (${COV_RESULT})"
            exit 1
          fi
          if [[ "${MUTANTS_RESULT}" != "success" && "${MUTANTS_RESULT}" != "skipped" ]]; then
            echo "::error::mutants-smoke failed (${MUTANTS_RESULT})"
            exit 1
          fi
          echo "All quality gate checks passed!"

  publish:
    name: Auto-Publish to Crates.io & Create GitHub Release
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: always() && needs.quality-gate.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
      checks: read
    steps:
      - name: Checkout skybouncer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "publish"
          cache-on-failure: true

      - name: Extract Current Version & Name
        id: pkg_info
        run: |
          VERSION=$(grep -m1 '^[[:space:]]*version[[:space:]]*=' Cargo.toml | awk -F'"' '{print $2}')
          NAME=$(grep -m1 '^[[:space:]]*name[[:space:]]*=' Cargo.toml | awk -F'"' '{print $2}')
          SKYBASE_VER=$(grep -m1 '^skybase[[:space:]]*=' Cargo.toml | sed -E 's/.*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          SKYAUTH_VER=$(grep -m1 '^skyauth[[:space:]]*=' Cargo.toml | awk -F'"' '{print $2}')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "skybase_version=${SKYBASE_VER}" >> "$GITHUB_OUTPUT"
          echo "skyauth_version=${SKYAUTH_VER}" >> "$GITHUB_OUTPUT"
          echo "Detected package: ${NAME} v${VERSION} (skybase=${SKYBASE_VER}, skyauth=${SKYAUTH_VER})"

      - name: Check if Version Already Published on Crates.io
        id: check_published
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: ${{ steps.pkg_info.outputs.name }}-release-check" "https://crates.io/api/v1/crates/${{ steps.pkg_info.outputs.name }}/${{ steps.pkg_info.outputs.version }}" || echo "000")
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.pkg_info.outputs.version }} is already published on crates.io."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.pkg_info.outputs.version }} is NOT published on crates.io yet."
          fi

      - name: Wait for Sibling Dependencies in Crates.io Index
        if: steps.check_published.outputs.published == 'false'
        run: |
          SKYBASE_VER="${{ steps.pkg_info.outputs.skybase_version }}"
          SKYAUTH_VER="${{ steps.pkg_info.outputs.skyauth_version }}"
          echo "Checking if skybase ${SKYBASE_VER} and skyauth ${SKYAUTH_VER} are available on crates.io..."
          max_attempts=30
          attempt=1
          until [ $attempt -gt $max_attempts ]; do
            STATUS_BASE=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: skybouncer-dep-check" "https://crates.io/api/v1/crates/skybase/${SKYBASE_VER}" || echo "000")
            STATUS_AUTH=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: skybouncer-dep-check" "https://crates.io/api/v1/crates/skyauth/${SKYAUTH_VER}" || echo "000")
            if [ "$STATUS_BASE" -eq 200 ] && [ "$STATUS_AUTH" -eq 200 ]; then
              echo "skybase ${SKYBASE_VER} and skyauth ${SKYAUTH_VER} are confirmed published on crates.io!"
              break
            fi
            echo "Attempt $attempt/$max_attempts: skybase=$STATUS_BASE skyauth=$STATUS_AUTH. Waiting 15s..."
            sleep 15
            attempt=$((attempt + 1))
          done
          if [ $attempt -gt $max_attempts ]; then
            echo "::error::Timed out waiting for dependencies 'skybase ${SKYBASE_VER}' / 'skyauth ${SKYAUTH_VER}' on crates.io."
            exit 1
          fi

      - name: Validate package before publish
        if: steps.check_published.outputs.published == 'false'
        run: cargo publish --dry-run --allow-dirty

      - name: Publish to Crates.io
        if: steps.check_published.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not configured; cannot publish"
            exit 1
          fi
          echo "Publishing ${{ steps.pkg_info.outputs.name }} v${{ steps.pkg_info.outputs.version }} to crates.io..."
          cargo publish --allow-dirty --token "${CARGO_REGISTRY_TOKEN}"

      - name: Create or Update GitHub Release Tag
        if: steps.check_published.outputs.published == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: "${{ steps.pkg_info.outputs.version }}"
          TAG_NAME: "v${{ steps.pkg_info.outputs.version }}"
        run: |
          if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Creating GitHub Release ${TAG_NAME}..."
            NOTES_FILE=$(mktemp)
            if [ -f CHANGELOG.md ]; then
              awk -v ver="${VERSION}" '
                index($0, "## [" ver "]") == 1 { in_sec=1; print; next }
                index($0, "## [") == 1 && in_sec { exit }
                in_sec { print }
              ' CHANGELOG.md > "${NOTES_FILE}"
            fi
            if [ -s "${NOTES_FILE}" ]; then
              gh release create "${TAG_NAME}" \
                --target "${GITHUB_SHA}" \
                --title "${TAG_NAME} - Production Release" \
                --notes-file "${NOTES_FILE}"
            else
              gh release create "${TAG_NAME}" \
                --target "${GITHUB_SHA}" \
                --title "${TAG_NAME} - Production Release" \
                --generate-notes
            fi
            rm -f "${NOTES_FILE}"
          else
            echo "GitHub Release ${TAG_NAME} already exists."
          fi
