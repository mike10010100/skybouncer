name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-gate:
    name: Rust Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout skybouncer
        uses: actions/checkout@v4
        with:
          path: skybouncer

      - name: Checkout sibling dependency (skybase)
        uses: actions/checkout@v4
        with:
          repository: mike10010100/skybase
          path: skybase

      - name: Checkout sibling dependency (skyauth)
        uses: actions/checkout@v4
        with:
          repository: mike10010100/skyauth
          path: skyauth

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            skybouncer -> skybouncer/target
            skybase -> skybase/target
            skyauth -> skyauth/target

      - name: Install Cargo Deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: 1. Enforce Code Formatting
        working-directory: skybouncer
        run: cargo fmt --all -- --check

      - name: 2. Enforce Strict Clippy Lints
        working-directory: skybouncer
        run: cargo clippy --all-targets -- -D warnings

      - name: 3. Run All Test Suites
        working-directory: skybouncer
        run: cargo test --all-targets

      - name: 4. Dependency Governance & Advisory Scan (cargo-deny)
        working-directory: skybouncer
        run: cargo deny check
