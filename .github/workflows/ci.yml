name: CI & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version-bump-check:
    name: Enforce Semantic Version Bump & CHANGELOG on PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Semantic Version Bump & CHANGELOG Entry
        run: |
          chmod +x ./scripts/check_version_bump.sh
          ./scripts/check_version_bump.sh

  lint-and-audit:
    name: Lint, Audit & Lean Core
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout skybouncer
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "lint"
          cache-on-failure: true

      - name: Install CI Cargo Utilities
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - name: 1. Enforce Code Formatting
        run: cargo fmt --all -- --check

      - name: 2. Enforce Strict Clippy Lints
        run: cargo clippy --all-targets -- -D warnings

      - name: 2b. Enforce Lean Core Build (no default features)
        run: cargo clippy --lib --no-default-features -- -D warnings

      - name: 3. Dependency Policy Governance (cargo-deny)
        run: cargo deny check

      - name: 4. Security Vulnerability Scan (cargo-audit)
        run: cargo audit

  coverage-and-tests:
    name: Test Suite & Coverage (>= 92%)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_LLVM_COV_TARGET_DIR: target
    steps:
      - name: Checkout skybouncer
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install CI Cargo Utilities
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "coverage"
          cache-all-crates: true
          cache-on-failure: true

      - name: 5. Run Test Suite & Enforce >= 92% Coverage (nextest + llvm-cov)
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --all-targets --lcov --output-path lcov.info
          cargo llvm-cov report --fail-under-lines 92

      - name: 6. Run Documentation Tests
        run: cargo test --doc

  mutants-smoke:
    name: Mutation Testing Smoke Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout skybouncer
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "mutants"
          cache-all-crates: true
          cache-on-failure: true

      - name: Install cargo-nextest & cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-mutants

      - name: 7. Mutation Testing Smoke Test (cargo-mutants)
        # Reuses cached target/ in-place and compiles only the library unit-test target
        # (avoiding relinking all 34 integration test binaries per mutant).
        run: cargo mutants --in-place --cargo-arg --lib --file src/time.rs --file src/util.rs

  quality-gate:
    name: Rust Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [lint-and-audit, coverage-and-tests, mutants-smoke]
    steps:
      - name: Verify All Parallel Quality Gate Jobs Succeeded
        env:
          LINT_RESULT: ${{ needs.lint-and-audit.result }}
          COV_RESULT: ${{ needs.coverage-and-tests.result }}
          MUTANTS_RESULT: ${{ needs.mutants-smoke.result }}
        run: |
          echo "lint-and-audit    : ${LINT_RESULT}"
          echo "coverage-and-tests: ${COV_RESULT}"
          echo "mutants-smoke     : ${MUTANTS_RESULT}"
          if [[ "${LINT_RESULT}" != "success" ]]; then
            echo "::error::lint-and-audit failed (${LINT_RESULT})"
            exit 1
          fi
          if [[ "${COV_RESULT}" != "success" ]]; then
            echo "::error::coverage-and-tests failed (${COV_RESULT})"
            exit 1
          fi
          if [[ "${MUTANTS_RESULT}" != "success" && "${MUTANTS_RESULT}" != "skipped" ]]; then
            echo "::error::mutants-smoke failed (${MUTANTS_RESULT})"
            exit 1
          fi
          echo "All quality gate checks passed!"

  publish:
    name: Auto-Publish to Crates.io & Create GitHub Release
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: always() && needs.quality-gate.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
      checks: read
    steps:
      - name: Checkout skybouncer
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Extract Current Version & Name
        id: pkg_info
        run: |
          VERSION=$(grep -m1 '^[[:space:]]*version[[:space:]]*=' Cargo.toml | awk -F'"' '{print $2}')
          NAME=$(grep -m1 '^[[:space:]]*name[[:space:]]*=' Cargo.toml | awk -F'"' '{print $2}')
          SKYBASE_VER=$(grep -m1 '^skybase[[:space:]]*=' Cargo.toml | sed -E 's/.*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          SKYAUTH_VER=$(grep -m1 '^skyauth[[:space:]]*=' Cargo.toml | awk -F'"' '{print $2}')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "skybase_version=${SKYBASE_VER}" >> "$GITHUB_OUTPUT"
          echo "skyauth_version=${SKYAUTH_VER}" >> "$GITHUB_OUTPUT"
          echo "Detected package: ${NAME} v${VERSION} (skybase=${SKYBASE_VER}, skyauth=${SKYAUTH_VER})"

      - name: Check if Version Already Published on Crates.io
        id: check_published
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: ${{ steps.pkg_info.outputs.name }}-release-check" "https://crates.io/api/v1/crates/${{ steps.pkg_info.outputs.name }}/${{ steps.pkg_info.outputs.version }}" || echo "000")
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.pkg_info.outputs.version }} is already published on crates.io."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.pkg_info.outputs.version }} is NOT published on crates.io yet."
          fi

      - name: Wait for Sibling Dependencies in Crates.io Index
        if: steps.check_published.outputs.published == 'false'
        run: |
          SKYBASE_VER="${{ steps.pkg_info.outputs.skybase_version }}"
          SKYAUTH_VER="${{ steps.pkg_info.outputs.skyauth_version }}"
          echo "Checking if skybase ${SKYBASE_VER} and skyauth ${SKYAUTH_VER} are available on crates.io..."
          max_attempts=30
          attempt=1
          until [ $attempt -gt $max_attempts ]; do
            STATUS_BASE=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: skybouncer-dep-check" "https://crates.io/api/v1/crates/skybase/${SKYBASE_VER}" || echo "000")
            STATUS_AUTH=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: skybouncer-dep-check" "https://crates.io/api/v1/crates/skyauth/${SKYAUTH_VER}" || echo "000")
            if [ "$STATUS_BASE" -eq 200 ] && [ "$STATUS_AUTH" -eq 200 ]; then
              echo "skybase ${SKYBASE_VER} and skyauth ${SKYAUTH_VER} are confirmed published on crates.io!"
              break
            fi
            echo "Attempt $attempt/$max_attempts: skybase=$STATUS_BASE skyauth=$STATUS_AUTH. Waiting 15s..."
            sleep 15
            attempt=$((attempt + 1))
          done
          if [ $attempt -gt $max_attempts ]; then
            echo "::error::Timed out waiting for dependencies 'skybase ${SKYBASE_VER}' / 'skyauth ${SKYAUTH_VER}' on crates.io."
            exit 1
          fi

      - name: Validate package before publish
        if: steps.check_published.outputs.published == 'false'
        run: cargo publish --dry-run --allow-dirty

      - name: Publish to Crates.io
        if: steps.check_published.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not configured; cannot publish"
            exit 1
          fi
          echo "Publishing ${{ steps.pkg_info.outputs.name }} v${{ steps.pkg_info.outputs.version }} to crates.io..."
          cargo publish --allow-dirty --token "${CARGO_REGISTRY_TOKEN}"

      - name: Create or Update GitHub Release Tag
        if: steps.check_published.outputs.published == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: "v${{ steps.pkg_info.outputs.version }}"
        run: |
          if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Creating GitHub Release ${TAG_NAME}..."
            if [ -f CHANGELOG.md ]; then
              gh release create "${TAG_NAME}" \
                --target "${GITHUB_SHA}" \
                --title "${TAG_NAME} - Production Release" \
                --notes-file CHANGELOG.md
            else
              gh release create "${TAG_NAME}" \
                --target "${GITHUB_SHA}" \
                --title "${TAG_NAME} - Production Release" \
                --generate-notes
            fi
          else
            echo "GitHub Release ${TAG_NAME} already exists."
          fi
